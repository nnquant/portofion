[project]
name = "portofion-server"
version = "0.1.0"
description = "portofion API server"
requires-python = ">=3.12"
dependencies = [
    "portofion-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "loguru>=0.7",
    "typer>=0.12",
]

[project.scripts]
portofion = "portofion_server.cli:app"

[tool.uv.sources]
portofion-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portofion_server"]
