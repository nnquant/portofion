[project]
name = "portofion-client"
version = "0.1.0"
description = "Agent SDK for reporting strategy returns to portofion"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.scripts]
portofion-report = "portofion_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portofion_client"]
