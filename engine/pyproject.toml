[project]
name = "portofion-engine"
version = "0.1.0"
description = "Pure return-series analytics and portfolio simulation for portofion"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portofion_engine"]
