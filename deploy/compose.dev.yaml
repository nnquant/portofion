name: portofion-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portofion
      POSTGRES_USER: portofion
      POSTGRES_PASSWORD: portofion
    ports:
      - "55432:5432"
    volumes:
      - portofion-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portofion -d portofion"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  portofion-dev-db:
